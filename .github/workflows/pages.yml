name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      # The dictionary (plan.md step 21) is built here, never committed. The shards are cached
      # by the hash of the tool, so a push that leaves the tool alone reuses them; the raw
      # downloads (~120 MB) are cached too, so a tool change rebuilds from the same sources.
      - name: Restore built dictionary
        id: dict
        uses: actions/cache@v4
        with:
          path: public/dict
          key: dict-${{ hashFiles('tools/build-dict/**', 'src/dict/format.ts') }}
      - name: Restore dictionary sources
        if: steps.dict.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .dict-cache
          key: dict-sources-${{ hashFiles('tools/build-dict/main.ts') }}
      - name: Build dictionary
        if: steps.dict.outputs.cache-hit != 'true'
        run: npm run dict -- --cache .dict-cache
      - name: Build
        # Project sites live at https://<user>.github.io/<repo>/
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # Sync (plan.md step 36): repository variables, not secrets; the anon key is public by
          # design and the rows are guarded by row-level security. Unset, the build has no Account group.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
